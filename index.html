<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f5f5f7">
    <title>KQ Residency · PG Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand"><span class="brandmark">KQ</span> KQ Residency<span style="color:#9480dc">.</span></div>
            <div class="workspace">
                <div class="workspace-icon">⌂</div>
                <div><strong>KQ Residency</strong><small>PG workspace</small></div><span>⌄</span>
            </div>
            <p class="eyebrow">WORKSPACE</p>
            <nav class="nav" aria-label="Main navigation"><button class="active" data-page="dashboard"><span
                        class="nav-icon">◫</span>Dashboard</button><button data-page="tenants"><span
                        class="nav-icon">♙</span>Residents<span class="nav-count">PG</span></button><button
                    data-page="inventory"><span class="nav-icon">▦</span>Rooms</button><button
                    data-page="admin"><span class="nav-icon">⚙</span>Admin panel</button></nav>
            <div class="side-bottom">
                <div class="help-card"><strong>Need a hand?</strong>
                    <p>Our property team is just a message away.</p><button class="text-btn"
                        data-toast="Support chat is ready to help.">Contact support →</button>
                </div>
                <div class="profile">
                    <div class="avatar">SC</div>
                    <div><strong>Shekhar</strong><small>PG administrator</small></div><span class="dots">···</span>
                </div>
            </div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div class="topbrand"><span class="brandmark">KQ</span> KQ Residency</div><label
                    class="search"><span>⌕</span><input id="globalSearch" placeholder="Search anything..."
                        aria-label="Search"></label>
                <div class="top-spacer"></div><span class="top-link">Help center</span><button
                    class="icon-btn notification" aria-label="Notifications"
                    data-toast="You’re all caught up.">♧</button><button class="icon-btn" aria-label="Settings"
                    data-page="admin">⚙</button>
                <div class="top-avatar">SC</div>
            </header>
            <div class="content page-dashboard">
                <div id="pageMount"></div>
            </div>
        </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="modal-backdrop" id="modalBackdrop">
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h2 id="modalTitle">Add resident</h2>
            <p id="modalSubtitle">Assign a unique tenant ID and an available bed.</p>
            <form id="entryForm">
                <div class="form-grid" id="formFields"></div>
                <div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button
                        type="submit" class="btn primary" id="submitModal">Add resident</button></div>
            </form>
        </section>
    </div>
    <div class="modal-backdrop" id="detailBackdrop">
        <section class="modal detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
            <div class="card-head"><h2 id="detailTitle">Profile</h2><div class="actions"><button class="btn primary" id="detailEdit">Edit</button><button class="btn" id="detailClose" aria-label="Close">×</button></div></div>
            <div id="detailBody"></div>
        </section>
    </div>
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
