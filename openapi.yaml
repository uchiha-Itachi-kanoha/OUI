    UIFieldDefinition:
      type: object
      description: Describes a field for generic UI tables, forms, filters, and profiles
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, number, currency, date, boolean, enum, textarea, email, phone]
        valueType:
          type: string
          enum: [string, integer, number, boolean]
        format:
          type: string
          description: Optional display format such as sharing or currency
        required:
          type: boolean
          default: false
        readOnly:
          type: boolean
          default: false
        visibleIn:
          type: array
          items:
            type: string
            enum: [table, form, filter, profile]
        options:
          type: array
          items:
            type: string
        optionValues:
          type: array
          items:
            oneOf:
            - type: string
            - type: integer
            - type: number
        min:
          type: number
        max:
          type: number
        order:
          type: integer
        default:
          description: Default value used by the generic form renderer
        helpText:
          type: string
      required: [key, label, type]
    UIBootstrapResponse:
      type: object
      example:
        schemaVersion: 1
        property:
          id: 1
          name: KQ Residency
          address: 12 Residency Road, Bengaluru
          currency: INR
          rentDueDay: 5
        fields:
          room:
          - key: id
            label: Room ID
            type: number
            readOnly: true
            visibleIn: [table, profile]
            order: 1
          - key: floor
            label: Floor
            type: number
            visibleIn: [form, table, profile, filter]
            order: 2
          - key: sharingCapacity
            label: Sharing
            type: enum
            valueType: integer
            format: sharing
            options: [Single sharing, Double sharing, Triple sharing]
            optionValues: [1, 2, 3]
            required: true
            min: 1
            visibleIn: [form, table, profile, filter]
            order: 3
          - key: defaultMonthlyRent
            label: Rent per person / month
            type: currency
            required: true
            min: 0
            visibleIn: [form, table, profile]
            order: 4
          - key: maintenance
            label: Maintenance
            type: boolean
            visibleIn: [form, table, profile, filter]
          person:
          - key: id
            label: Person ID
            type: number
            readOnly: true
            visibleIn: [table, profile]
          - key: name
            label: Full name
            type: text
            required: true
            visibleIn: [form, table, profile]
          - key: phone
            label: Phone
            type: phone
            required: true
            visibleIn: [form, table, profile]
          - key: email
            label: Email
            type: email
            visibleIn: [form, table, profile]
          - key: roomName
            label: Current room
            type: text
            readOnly: true
            visibleIn: [table, profile]
          rent:
          - key: amountDue
            label: Amount due
            type: currency
            visibleIn: [table, profile]
          - key: amountPaid
            label: Amount paid
            type: currency
            visibleIn: [table, profile]
          - key: balance
            label: Balance
            type: currency
            visibleIn: [table, profile]
          - key: status
            label: Rent status
            type: enum
            options: [pending, partial, paid]
            visibleIn: [table, profile, filter]
      properties:
        schemaVersion:
          type: integer
        property:
          $ref: "#/components/schemas/PropertySettingsResponse"
        fields:
          type: object
          description: Field definitions by resource. Include new room/person fields here to render them in generic forms and tables.
          properties:
            room:
              type: array
              items:
                $ref: "#/components/schemas/UIFieldDefinition"
            person:
              type: array
              items:
                $ref: "#/components/schemas/UIFieldDefinition"
            rent:
              type: array
              items:
                $ref: "#/components/schemas/UIFieldDefinition"
            settings:
              type: array
              items:
                $ref: "#/components/schemas/UIFieldDefinition"
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/UIFieldDefinition"
      required: [schemaVersion, fields]
